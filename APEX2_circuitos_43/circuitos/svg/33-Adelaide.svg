<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" data-circuit-id="CIR-0033" data-svg-version="3" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Adelaide</title>
  <desc>Versão 3 (2026-10-15, SVG-CIRCUITS-03F): acrescido g#start_finish (chegada = largada 0.73730, mapas secundários indicados pelo proprietário, provisório); path#track preservados. APEX GP Manager 2.0 · CIR-0033 · versão 2 (2026-10-15, SVG-CIRCUITS-03C). path#track SUBSTITUÍDO pela variante F1 1985–1995 (decisão do proprietário), antes traçado curto (Adelaide 500), preservado em circuitos/svg/_versoes/33-Adelaide_v1.svg. Geometria: eixos de via OSM do percurso do GP (East Terrace → Stag Turn → Rundle Road/Jones Straight → Brewery Bend → Dequetteville Terrace/Brabham Straight → Wakefield Road → Senna Chicane), proposta da 03A sem alteração. Comprovação: ajuste por similaridade contra dois mapas independentes, https://commons.wikimedia.org/wiki/File:Adelaide_Street_Circuit_-_long.svg (domínio público, "as used for Formula One") (RMS 16.0 m, p95 25.6 m, máx. 54.5 m) e https://commons.wikimedia.org/wiki/File:Adelaide_(long_route).svg (CC BY-SA 3.0, traçado longo sobre a malha de ruas, curvas 1–16) (RMS 18.1 m, p95 28.5 m, máx. 52.6 m; maior desvio no trecho East Terrace/Grenfell, onde os dois mapas são esquemáticos). Extensão medida 3.873 km vs 3,780 km oficial (+2.5%; eixo de rua). (c) OpenStreetMap contributors, ODbL.</desc>
